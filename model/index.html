  <div class="wrap">
    <div class="cols"><div><h3 data-sitename></h3><p>Квадроциклы, багги, снегоходы и гидроциклы из Канады. Цены за технику в Москве.</p></div><div id="footSellers" style="display:contents"></div></div>

  </div>

<script src="data.js?v=20261002b"></script>
<script src="assets/site.js?v=20261003b"></script>
<script>
frame();
const id = new URLSearchParams(location.search).get("id");
const it = id && findModel(id);
const box = document.getElementById("model");
if (!it) {
  box.innerHTML = `<div class="note" style="margin:20px 0"><b>Этой техники уже нет в списке.</b> Возможно, её продали. <a href="./#catalog">Посмотрите, что есть сейчас</a>, или оставьте <a href="./#request">заявку</a>, и мы найдём похожую.</div>`;
} else {
  document.title = title(it) + " " + it.year + " — " + SITE.name;
  const g = groupOf(it), w = where(it), imgs = it.imgs || [];
  box.innerHTML = `<div class="model">
    <div>
      <div class="ph">${galleryHtml(it, true)}${pillsHtml(it)}${(!it.noQty && (it.qty > 1 || it.stage === "preorder" || it.stage === "offer")) ? `<span class="qty">${it.qty} шт.</span>` : ""}</div>
      ${imgs.length > 1 ? `<div class="thumbs" aria-label="Все фото">${imgs.map((src, i) => `<button type="button" data-th="${i}" aria-current="${i === 0}" aria-label="Фото ${i + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
    </div>
    <div class="pane">
      <div><h1>${esc(title(it))}</h1><div class="meta" style="font-size:16px">${esc(yearStr(it))}, ${esc(it.color || "цвет уточняется")}</div></div>
      <div class="price">${priceHtml(it)}</div>
      <dl class="facts">
        <dt>Статус</dt><dd>${it.reserved ? "Забронировано" : esc(g.t) + (isFree(it) ? ", в свободной продаже" : "")}</dd>
        <dt>В Москве</dt><dd>${esc(eta(it))}</dd>
        ${w ? `<dt>Где смотреть</dt><dd>${esc(w)}</dd>` : ""}
        ${(!it.noQty && (it.qty > 1 || it.stage === "preorder" || it.stage === "offer")) ? `<dt>Доступно</dt><dd>${it.qty} шт.</dd>` : ""}
        ${(it.specs || []).map(s => { const p = s.split(":"); return p.length > 1 ? `<dt>${esc(p[0])}</dt><dd>${esc(p.slice(1).join(":").trim())}</dd>` : `<dt>Особенности</dt><dd>${esc(s)}</dd>`; }).join("")}
      </dl>
      <div class="actions"><button class="btn primary" type="button" id="ask">${askLabel(it)}</button><button class="btn" type="button" id="share">Скопировать ссылку</button></div>
      <div class="note"><b>Цена — за технику в Москве.</b> Доставку до вашего города посчитаем отдельно. ЭПСМ по желанию: <b>+${fmt(DATA.epsmRub || 166000)} ₽</b>. Рубли посчитаны по курсу ${rateStr()} ₽ за 1 $, точную сумму назовёт продавец в день оплаты.</div>
      <p class="updated">${esc(updatedLine())}</p>
    </div></div>${typeof descHtml === "function" ? descHtml(it) : ""}`;
  document.getElementById("ask").onclick = () => askAbout(it);
  document.getElementById("share").onclick = async () => {
    const url = location.origin + location.pathname + "?id=" + encodeURIComponent(it.ids[0]) + (new URLSearchParams(location.search).get("city") ? "&city=" + encodeURIComponent(new URLSearchParams(location.search).get("city")) : "");
    if (await copyText(url)) { toast("Ссылка скопирована"); return; }
    if (navigator.share) { try { await navigator.share({title: title(it), url}); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    prompt("Скопируйте ссылку:", url);
  };
  box.addEventListener("click", e => { const b = e.target.closest("[data-th]"); if (!b) return; const gal = box.querySelector(".gal"); gal.scrollTo({left: gal.clientWidth * Number(b.dataset.th), behavior: "smooth"}); });
}
</script>

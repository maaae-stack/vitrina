name: Daily rate
on:
  schedule:
    - cron: "47 3 * * *"   # 06:47 МСК
    - cron: "17 4,5,6,8 * * *"   # повторы, если GitHub задержал запуск (скрипт ничего не меняет, если дата уже сегодняшняя)
  workflow_dispatch:
    inputs:
      dry:
        description: "Только проверить курс ЦБ, ничего не менять"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update rate and date
        env:
          DRY: ${{ inputs.dry }}
        run: python3 .github/update_rate.py
      - name: Commit
        run: |
          git config user.name "maaae-stack"
          git config user.email "maaae-stack@users.noreply.github.com"
          if ! git diff --quiet data.js; then
            git commit -am "Курс ЦБ + надбавка на $(TZ=Europe/Moscow date +%d.%m)"
            git push
          else
            echo "Курс на сегодня уже стоит, ничего не меняю"
          fi
